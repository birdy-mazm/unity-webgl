<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

    <title>Unity Web Player | MazM_Studio</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #unity-container {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #231F20;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #231F20;
      }

      #loading-text {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 16px;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="loading-text">Loading...</div>

    <div id="unity-container">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
    </div>

    <script>
      function getBasePath() {
        var path = window.location.pathname;

        // 예:
        // /unity-webgl/
        // /unity-webgl/학생시트ID
        // /webgltest/
        // /webgltest/학생시트ID
        var parts = path.split('/').filter(function (p) {
          return p.length > 0;
        });

        // User Page 루트 배포 대응: https://username.github.io/
        if (parts.length === 0) {
          return "/";
        }

        // GitHub Project Page에서는 첫 path가 repo 이름
        return "/" + parts[0] + "/";
      }

      var basePath = getBasePath();
      var buildPath = basePath + "Build/Build";
      var loaderUrl = buildPath + "/Build.loader.js";

      console.log("[WebGL] href =", window.location.href);
      console.log("[WebGL] pathname =", window.location.pathname);
      console.log("[WebGL] basePath =", basePath);
      console.log("[WebGL] buildPath =", buildPath);
      console.log("[WebGL] loaderUrl =", loaderUrl);

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = function () {
        createUnityInstance(document.querySelector("#unity-canvas"), {
          arguments: [],
          dataUrl: buildPath + "/Build.data",
          frameworkUrl: buildPath + "/Build.framework.js",
          codeUrl: buildPath + "/Build.wasm",
          streamingAssetsUrl: basePath + "StreamingAssets",
          companyName: "MazM",
          productName: "MazM_Studio",
          productVersion: "1.3"
        }).then(function (unityInstance) {
          var loadingText = document.getElementById("loading-text");
          if (loadingText) {
            loadingText.style.display = "none";
          }
        }).catch(function (message) {
          alert(message);
          console.error(message);
        });
      };

      script.onerror = function () {
        var msg = "Unity loader.js를 불러오지 못했습니다: " + loaderUrl;
        alert(msg);
        console.error(msg);
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
